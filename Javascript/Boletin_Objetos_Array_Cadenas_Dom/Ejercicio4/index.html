<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4</title>
    <link rel="stylesheet" href="../../../css/simple.css">
</head>
<body>
    <form id="form">
        <input type="text" name="title" id="inputTitle" placeholder="Title">
        <input type="text" name="author" id="inputAuthor" placeholder="Author">
        <input type="number" name="price" id="inputPrice" placeholder="Price">
        <input type="text" name="category" id="inputCategory" placeholder="Category">
        <button type="submit">Submit</button>
    </form>
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Price</th>
                <th>Category</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>
    <script type="module" src="js/main.js"></script>
</body>
</html>
